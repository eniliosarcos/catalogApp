name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create environment.prod.ts from secrets
        run: |
          cat > projects/catalog/src/environments/environment.prod.ts << 'EOF'
import { Environment } from '@shared/models/environment.model';

export const environment: Environment = {
  production: true,
  contact: {
    whatsapp: '${{ secrets.WHATSAPP_NUMBER }}',
    whatsappDisplay: '${{ secrets.WHATSAPP_DISPLAY }}',
    instagram: '${{ secrets.INSTAGRAM_HANDLE }}',
    telegram: '${{ secrets.TELEGRAM_HANDLE }}',
  },
};
EOF

      - name: Build catalog
        run: npx ng build catalog --configuration production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/catalog/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
