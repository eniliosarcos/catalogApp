<div class="bg-white rounded-lg shadow-md p-4 flex gap-4">
  <!-- Product Image Placeholder -->
  <div class="w-24 h-24 bg-gray-200 rounded-lg flex-shrink-0 flex items-center justify-center">
    <span class="text-3xl">📦</span>
  </div>

  <!-- Product Info -->
  <div class="flex-1 min-w-0">
    <h3 class="font-semibold text-gray-800 truncate">Producto ID: {{ item.productId }}</h3>
    <p class="text-gray-600 text-sm">SKU: N/A</p>
    
    <div class="flex items-center gap-4 mt-2">
      <!-- Quantity Controls -->
      <div class="flex items-center border border-gray-300 rounded-lg">
        <button (click)="decreaseQuantity()" 
                class="px-3 py-1 text-gray-600 hover:bg-gray-100 transition-colors">
          -
        </button>
        <span class="px-3 py-1 border-x border-gray-300">{{ item.quantity }}</span>
        <button (click)="increaseQuantity()" 
                class="px-3 py-1 text-gray-600 hover:bg-gray-100 transition-colors">
          +
        </button>
      </div>

      <!-- Remove Button -->
      <button (click)="onRemove()" 
              class="text-red-500 hover:text-red-700 transition-colors text-sm">
        Eliminar
      </button>
    </div>
  </div>

  <!-- Price -->
  <div class="text-right">
    <p class="text-lg font-bold text-gray-800">$0.00</p>
    <p class="text-sm text-gray-500">$0.00 c/u</p>
  </div>
</div>
