<div class="min-h-screen">
  <!-- Hero Section -->
  <section class="hero-section relative overflow-hidden"
           [style.opacity]="1 - scrollProgress()"
           [style.transform]="'scale(' + (1 - scrollProgress() * 0.05) + ')'">
    <div class="hero-bg absolute inset-0"></div>
    <div class="relative z-10 container mx-auto px-4 text-center py-10">
      <h1 class="text-3xl md:text-4xl font-bold text-[#8B2252] mb-2 tracking-wide">
        L'Essence de Cerise
      </h1>
      <p class="text-base md:text-lg text-[#6B5744] mb-4 italic">
        Descubre nuestra colección exclusiva
      </p>
      <div class="flex justify-center gap-3 flex-wrap">
        <span class="bg-[#C9A96E] text-white px-5 py-1.5 rounded-full text-xs font-semibold tracking-wider">✓ Envío gratis</span>
        <span class="bg-[#C9A96E] text-white px-5 py-1.5 rounded-full text-xs font-semibold tracking-wider">✓ Garantía</span>
        <span class="bg-[#C9A96E] text-white px-5 py-1.5 rounded-full text-xs font-semibold tracking-wider">✓ Soporte 24/7</span>
      </div>
    </div>
  </section>

  <!-- Categories Section -->
  <section class="py-16 relative z-20 bg-[#F5E6E0]">
    <div class="container mx-auto px-4">
      <h2 class="text-4xl font-bold text-center mb-12 text-[#8B2252]">Explora nuestras categorías</h2>
      
      @if (loading) {
        <shared-loading message="Cargando categorías..."></shared-loading>
      } @else {
        <app-category-grid [categories]="categories"></app-category-grid>
      }
    </div>
  </section>
</div>
