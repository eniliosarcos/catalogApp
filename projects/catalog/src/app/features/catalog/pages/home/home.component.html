<div class="min-h-screen">
  <!-- Hero Section -->
  <section class="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-16">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Bienvenido a Nuestro Catálogo</h1>
      <p class="text-xl text-blue-100 mb-8">Descubre productos de calidad con los mejores precios</p>
      <div class="flex justify-center gap-4">
        <span class="bg-white/20 px-4 py-2 rounded-full text-sm">✓ Envío gratis</span>
        <span class="bg-white/20 px-4 py-2 rounded-full text-sm">✓ Garantía</span>
        <span class="bg-white/20 px-4 py-2 rounded-full text-sm">✓ Soporte 24/7</span>
      </div>
    </div>
  </section>

  <!-- Categories Section -->
  <section class="py-12">
    <div class="container mx-auto px-4">
      <h2 class="text-3xl font-bold text-center mb-8">Explora nuestras categorías</h2>
      
      @if (loading) {
        <shared-loading message="Cargando categorías..."></shared-loading>
      } @else {
        <app-category-grid [categories]="categories"></app-category-grid>
      }
    </div>
  </section>
</div>
