<div class="min-h-screen">
  <!-- Hero Section -->
  <section class="bg-gradient-to-r from-[#F5E6E0] via-[#E8A0BF] to-[#D4739D] py-20">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-4xl md:text-5xl font-serif font-bold text-[#C9A96E] mb-4">L'Essence de Cerise</h1>
      <p class="text-xl text-[#8B2252] mb-8 font-serif">Descubre nuestra colección exclusiva</p>
      <div class="flex justify-center gap-4 flex-wrap">
        <span class="bg-[#C9A96E] text-white px-6 py-2 rounded-full text-sm font-serif">✓ Envío gratis</span>
        <span class="bg-[#C9A96E] text-white px-6 py-2 rounded-full text-sm font-serif">✓ Garantía</span>
        <span class="bg-[#C9A96E] text-white px-6 py-2 rounded-full text-sm font-serif">✓ Soporte 24/7</span>
      </div>
    </div>
  </section>

  <!-- Categories Section -->
  <section class="py-12">
    <div class="container mx-auto px-4">
      <h2 class="text-3xl font-serif font-bold text-center mb-8 text-[#C9A96E]">Explora nuestras categorías</h2>
      
      @if (loading) {
        <shared-loading message="Cargando categorías..."></shared-loading>
      } @else {
        <app-category-grid [categories]="categories"></app-category-grid>
      }
    </div>
  </section>
</div>
