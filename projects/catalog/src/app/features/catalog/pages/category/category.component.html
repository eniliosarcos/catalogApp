<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-8">
    <!-- Breadcrumbs -->
    <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>

    @if (loading) {
      <shared-loading message="Cargando productos..."></shared-loading>
    } @else if (category) {
      <!-- Category Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">{{ category.name }}</h1>
        <p class="text-gray-600">{{ category.description }}</p>
      </div>

      <!-- Products Grid -->
      @if (products.length > 0) {
        <app-product-grid [products]="products"></app-product-grid>
      } @else {
        <div class="text-center py-16">
          <p class="text-gray-500 text-lg">No hay productos en esta categoría</p>
          <a routerLink="/" class="mt-4 inline-block text-blue-600 hover:underline">
            ← Volver al inicio
          </a>
        </div>
      }
    } @else {
      <div class="text-center py-16">
        <p class="text-gray-500 text-lg">Categoría no encontrada</p>
        <a routerLink="/" class="mt-4 inline-block text-blue-600 hover:underline">
          ← Volver al inicio
        </a>
      </div>
    }
  </div>
</div>
