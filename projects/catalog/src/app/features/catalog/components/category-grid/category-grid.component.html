<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  @for (category of categories; track category.id) {
    <a [routerLink]="['/category', category.slug]" 
       class="category-card group bg-white rounded-xl shadow-md overflow-hidden border border-[#C9A96E]/20 hover:shadow-xl hover:shadow-[#C9A96E]/20 transition-all duration-300 transform hover:-translate-y-1">
      <div class="aspect-video bg-[#F5E6E0] relative overflow-hidden">
        <img [src]="category.imageUrl" 
             [alt]="category.name"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        <div class="absolute inset-0 bg-gradient-to-t from-[#8B2252]/20 to-transparent group-hover:from-[#8B2252]/30 transition-colors"></div>
      </div>
      <div class="p-6">
        <h3 class="text-xl font-serif font-bold text-[#C9A96E] mb-2 group-hover:text-[#8B2252] transition-colors">
          {{ category.name }}
        </h3>
        <p class="text-[#7A6558] text-sm line-clamp-2">{{ category.description }}</p>
      </div>
    </a>
  }
</div>
