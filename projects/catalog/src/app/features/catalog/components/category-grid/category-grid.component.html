<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  @for (category of categories; track category.id) {
    <a [routerLink]="['/category', category.slug]" 
       class="category-card group bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
      <div class="aspect-video bg-gray-200 relative overflow-hidden">
        <img [src]="category.imageUrl" 
             [alt]="category.name"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        <div class="absolute inset-0 bg-black/20 group-hover:bg-black/30 transition-colors"></div>
      </div>
      <div class="p-6">
        <h3 class="text-xl font-bold text-gray-800 mb-2 group-hover:text-blue-600 transition-colors">
          {{ category.name }}
        </h3>
        <p class="text-gray-600 text-sm line-clamp-2">{{ category.description }}</p>
      </div>
    </a>
  }
</div>
