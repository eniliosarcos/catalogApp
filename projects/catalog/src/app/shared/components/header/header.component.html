<header class="bg-[#F5E6E0] border-b border-[#C9A96E]/30 fixed top-0 left-0 right-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-20">
      <!-- Logo LC Monogram -->
      <a routerLink="/" class="flex items-center gap-3">
        <span class="text-3xl font-serif font-bold text-[#C9A96E]">LC</span>
        <span class="hidden sm:inline text-lg font-serif text-[#C9A96E]">L'Essence de Cerise</span>
      </a>

      <!-- Navigation -->
      <nav class="hidden md:flex items-center gap-8">
        <a routerLink="/" routerLinkActive="text-[#8B2252]" [routerLinkActiveOptions]="{exact: true}"
           class="text-[#C9A96E] hover:text-[#8B2252] transition-colors font-serif">
          Inicio
        </a>
      </nav>

      <!-- Cart -->
      <a routerLink="/cart" class="relative flex items-center gap-2 text-[#C9A96E] hover:text-[#8B2252] transition-colors">
        <span class="text-2xl">🛒</span>
        @if (cart && cart.items.length > 0) {
          <span class="absolute -top-2 -right-2 bg-[#8B2252] text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">
            {{ cart.items.length }}
          </span>
        }
      </a>
    </div>
  </div>
</header>
