<nav class="flex items-center text-sm text-gray-600 mb-6">
  @for (item of items; track item.label; let last = $last) {
    @if (!last && item.link) {
      <a [routerLink]="item.link" class="hover:text-blue-600 transition-colors">
        {{ item.label }}
      </a>
      <span class="mx-2 text-gray-400">/</span>
    } @else {
      <span [class]="last ? 'text-gray-800 font-medium' : 'text-gray-600'">
        {{ item.label }}
      </span>
    }
  }
</nav>
