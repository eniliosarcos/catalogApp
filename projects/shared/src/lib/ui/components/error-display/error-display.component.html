<div class="error-container bg-red-50 border border-red-200 rounded-lg p-6 text-center">
  <div class="error-icon text-red-500 mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
  </div>

  <h3 class="text-lg font-semibold text-red-800 mb-2">{{ title }}</h3>

  <p class="text-red-600 mb-4">{{ error?.message || 'Ha ocurrido un error inesperado' }}</p>

  @if (error?.details) {
    <p class="text-sm text-red-500 mb-4">{{ error.details }}</p>
  }

  @if (error?.code) {
    <p class="text-xs text-gray-500 mb-4">Código: {{ error.code }}</p>
  }

  @if (showRetry && error?.retryAction) {
    <button
      (click)="onRetry()"
      class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
      aria-label="Reintentar operación">
      Reintentar
    </button>
  }
</div>
