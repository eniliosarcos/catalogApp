<div class="p-6">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Configuración</h1>

  <!-- Success Message -->
  @if (successMessage()) {
    <div class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">
      {{ successMessage() }}
    </div>
  }

  <!-- Error Message -->
  @if (errorMessage()) {
    <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
      {{ errorMessage() }}
    </div>
  }

  <!-- Contact Form -->
  <div class="bg-white rounded-lg shadow-md p-6 max-w-2xl">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Datos de Contacto</h2>
    <p class="text-gray-500 text-sm mb-6">
      Estos datos se muestran en el catálogo para que los clientes puedan contactarte.
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- WhatsApp -->
      <div>
        <label for="whatsapp" class="block text-sm font-medium text-gray-700 mb-1">
          WhatsApp (número completo con código de país)
        </label>
        <input
          id="whatsapp"
          type="text"
          [ngModel]="whatsapp()"
          (ngModelChange)="whatsapp.set($event)"
          name="whatsapp"
          placeholder="+521234567890"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          [disabled]="isLoading()"
        />
      </div>

      <!-- WhatsApp Display -->
      <div>
        <label for="whatsappDisplay" class="block text-sm font-medium text-gray-700 mb-1">
          WhatsApp (formato de visualización)
        </label>
        <input
          id="whatsappDisplay"
          type="text"
          [ngModel]="whatsappDisplay()"
          (ngModelChange)="whatsappDisplay.set($event)"
          name="whatsappDisplay"
          placeholder="+52 123 456 7890"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          [disabled]="isLoading()"
        />
      </div>

      <!-- Instagram -->
      <div>
        <label for="instagram" class="block text-sm font-medium text-gray-700 mb-1">
          Instagram
        </label>
        <input
          id="instagram"
          type="text"
          [ngModel]="instagram()"
          (ngModelChange)="instagram.set($event)"
          name="instagram"
          placeholder="@tu_usuario"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          [disabled]="isLoading()"
        />
      </div>

      <!-- Telegram -->
      <div>
        <label for="telegram" class="block text-sm font-medium text-gray-700 mb-1">
          Telegram
        </label>
        <input
          id="telegram"
          type="text"
          [ngModel]="telegram()"
          (ngModelChange)="telegram.set($event)"
          name="telegram"
          placeholder="@tu_usuario"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          [disabled]="isLoading()"
        />
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <button
          type="submit"
          [disabled]="isLoading()"
          class="bg-gray-900 text-white py-2 px-6 rounded-lg hover:bg-gray-800 focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (isLoading()) {
            Guardando...
          } @else {
            Guardar
          }
        </button>
      </div>
    </form>
  </div>
</div>
