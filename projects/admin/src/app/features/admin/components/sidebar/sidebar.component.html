<aside class="w-64 bg-gray-900 text-white min-h-screen flex flex-col">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-700">
    <a routerLink="/dashboard" class="flex items-center gap-2">
      <svg lucideSettings class="w-6 h-6"></svg>
      <span class="text-xl font-bold">Admin Panel</span>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="p-4 flex-1">
    <ul class="space-y-2">
      <li>
        <a routerLink="/dashboard" routerLinkActive="bg-gray-700" [routerLinkActiveOptions]="{exact: true}"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
          <svg lucideLayoutDashboard class="w-5 h-5"></svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/products" routerLinkActive="bg-gray-700"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
          <svg lucidePackage class="w-5 h-5"></svg>
          <span>Productos</span>
        </a>
      </li>
      <li>
        <a routerLink="/categories" routerLinkActive="bg-gray-700"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
          <svg lucideFolderOpen class="w-5 h-5"></svg>
          <span>Categorías</span>
        </a>
      </li>
      <li>
        <a routerLink="/settings" routerLinkActive="bg-gray-700"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
          <svg lucideSettings class="w-5 h-5"></svg>
          <span>Configuración</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-gray-700 space-y-2">
    <a href="/catalogApp/" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors px-4 py-2">
      <svg lucideStore class="w-5 h-5"></svg>
      <span>Ver catálogo</span>
    </a>
    <button (click)="logout()" class="flex items-center gap-2 text-gray-400 hover:text-red-400 transition-colors px-4 py-2 w-full">
      <svg lucideLogOut class="w-5 h-5"></svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>
