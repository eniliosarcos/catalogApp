<aside class="w-64 bg-gray-900 text-white min-h-screen">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-700">
    <a routerLink="/admin" class="flex items-center gap-2">
      <span class="text-2xl">⚙️</span>
      <span class="text-xl font-bold">Admin Panel</span>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="p-4">
    <ul class="space-y-2">
      <li>
        <a routerLink="/admin" routerLinkActive="bg-gray-700" [routerLinkActiveOptions]="{exact: true}"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
          <span class="text-xl">📊</span>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/admin/products" routerLinkActive="bg-gray-700"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
          <span class="text-xl">📦</span>
          <span>Productos</span>
        </a>
      </li>
      <li>
        <a routerLink="/admin/categories" routerLinkActive="bg-gray-700"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
          <span class="text-xl">📁</span>
          <span>Categorías</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer -->
  <div class="absolute bottom-0 w-64 p-4 border-t border-gray-700">
    <a routerLink="/" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
      <span class="text-xl">🛍️</span>
      <span>Ver catálogo</span>
    </a>
  </div>
</aside>
